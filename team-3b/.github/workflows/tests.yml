name: Core Loop Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start mock Hardhat chain
        working-directory: mocks/contracts
        run: |
          npm install
          npx hardhat node --hostname 127.0.0.1 --port 8545 > /tmp/hardhat.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --silent --fail -X POST http://127.0.0.1:8545 \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' >/dev/null && break
            sleep 1
          done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run core loop tests
        run: pytest tests/unit/ tests/property/ --tb=short -v

      - name: Measure core coverage
        run: pytest --cov=inference --cov=common --cov-report=term-missing -q

      - name: Run on-chain-facing integration tests
        run: pytest tests/integration/test_event_listener_mock_chain.py tests/integration/test_proof_submitter_mock_chain.py tests/integration/test_onchain_pipeline_e2e.py tests/integration/test_wave2_real_redis.py --tb=short -v

      - name: Measure Wave 2 coverage
        run: pytest --cov=event_listener --cov=proof_submitter --cov-report=term-missing -q