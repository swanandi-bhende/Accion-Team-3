name: Core Loop Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Team A's contracts are installed onto this node by the tests themselves
      # (tests/conftest.py -> scripts/ops/install_team_a_local.py); starting the
      # node here keeps the startup out of the test timeouts.
      - name: Start local chain for Team A's contracts
        working-directory: chain
        run: |
          npm install
          npx hardhat node --hostname 127.0.0.1 --port 8545 > /tmp/hardhat.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --silent --fail -X POST http://127.0.0.1:8545 \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' >/dev/null && break
            sleep 1
          done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/fl.txt -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Run core loop tests
        run: pytest tests/unit/ tests/property/ --tb=short -v

      - name: Measure core coverage
        run: pytest --cov=inference --cov=common --cov-report=term-missing -q -m "not fl_network"

      - name: Run on-chain-facing integration tests
        run: pytest tests/integration/test_team_a_chain.py tests/integration/test_pipeline_e2e.py tests/integration/test_pipeline_resilience.py --tb=short -v

      - name: Measure Wave 2 coverage
        run: pytest --cov=event_listener --cov=proof_submitter --cov-report=term-missing -q -m "not fl_network"

  fl-integration:
    # Real Flower server + client *processes* over gRPC, mid-run crashes against a
    # real Redis, and the FL <-> Model Registry <-> TEE round-trip. Inherently
    # slower than the mocked unit tests, so it gets its own gated job with a
    # longer timeout instead of bloating the fast feedback loop -- or being
    # skipped entirely.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/fl.txt -r requirements/dev.txt

      - name: Run federated learning tests (reporting, in-process, and real network)
        run: pytest tests/property/test_fl_orchestrator.py tests/integration/test_federated_learning.py --tb=short -v

      - name: Measure federated learning coverage
        env:
          FL_REDIS_URL: redis://localhost:6379
        run: pytest tests/integration/test_federated_learning.py tests/property/test_fl_orchestrator.py --cov=federated_learning --cov-report=term-missing -q