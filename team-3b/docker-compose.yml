services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/export

  hardhat-node:
    image: node:20-alpine
    working_dir: /app/mocks/contracts
    volumes:
      - .:/app
    command: >
      sh -c "npm install && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"

  hardhat-deploy:
    image: node:20-alpine
    working_dir: /app/mocks/contracts
    volumes:
      - .:/app
    environment:
      - TRIGGER_MOCK_TASK=true
    command: >
      sh -c "npm install && sleep 5 && npx hardhat run scripts/deploy_and_trigger.js --network localhost"
    depends_on:
      - hardhat-node

  inference-engine:
    build: 
      context: .
      dockerfile: inference/Dockerfile
    env_file:
      - .env
    environment:
      - TEE_MODE=sgx
      - REDIS_URL=redis://redis:6379
      - MODEL_STORAGE_URL=http://ipfs:5001
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      ipfs:
        condition: service_started

  event-listener:
    build:
      context: .
      dockerfile: event_listener/Dockerfile
    environment:
      - WEB3_WS_URL=ws://hardhat-node:8545
      - REDIS_URL=redis://redis:6379
      - TASK_MANAGER_ADDRESS=${TASK_MANAGER_ADDRESS}
      - ESCROW_ADDRESS=${ESCROW_ADDRESS}
    # Optional, git-ignored local overrides (e.g. values decoded from the
    # hardhat deployment). See docs/DEV_SETUP.md; absent by default.
    env_file:
      - path: .env.mock
        required: false
    depends_on:
      redis:
        condition: service_healthy
      hardhat-deploy:
        condition: service_completed_successfully

  proof-submitter:
    build:
      context: .
      dockerfile: proof_submitter/Dockerfile
    environment:
      - WEB3_RPC_URL=http://hardhat-node:8545
      - REDIS_URL=redis://redis:6379
      - PROOF_SUBMITTER_CONTRACT_ADDRESS=${PROOF_SUBMITTER_CONTRACT_ADDRESS}
    env_file:
      - path: .env.mock
        required: false
    depends_on:
      redis:
        condition: service_healthy
      hardhat-deploy:
        condition: service_completed_successfully

  verification-api:
    build:
      context: .
      dockerfile: verification/Dockerfile
    environment:
      - MODEL_STORAGE_URL=http://ipfs:5001
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      ipfs:
        condition: service_started

  fl-orchestrator:
    build:
      context: .
      dockerfile: federated_learning/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - MODEL_STORAGE_URL=http://ipfs:5001
      - FL_NUM_CLIENTS=3
      - FL_NUM_ROUNDS=3
      - FL_MODEL_ID=fl-demo-model
    depends_on:
      redis:
        condition: service_healthy
      ipfs:
        condition: service_started

volumes:
  redis_data:
  ipfs_data:
