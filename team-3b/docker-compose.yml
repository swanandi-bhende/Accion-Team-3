services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/export

  hardhat-node:
    image: node:20-alpine
    working_dir: /app/mocks/contracts
    volumes:
      - .:/app
    command: >
      sh -c "npm install && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"

  hardhat-deploy:
    image: node:20-alpine
    working_dir: /app/mocks/contracts
    volumes:
      - .:/app
    environment:
      - TRIGGER_MOCK_TASK=true
      # The deploy container must reach the node *container*, not its own loopback.
      - WEB3_RPC_URL=http://hardhat-node:8545
    # deploy_and_trigger.js waits for the chain itself, so no sleep-based race.
    command: >
      sh -c "npm install && npx hardhat run scripts/deploy_and_trigger.js --network localhost"
    depends_on:
      - hardhat-node

  inference-engine:
    build: 
      context: .
      dockerfile: inference/Dockerfile
    env_file:
      - .env
    environment:
      - TEE_MODE=sgx
      - REDIS_URL=redis://redis:6379
      - MODEL_STORAGE_URL=http://ipfs:5001
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      ipfs:
        condition: service_started

  event-listener:
    build:
      context: .
      dockerfile: event_listener/Dockerfile
    environment:
      - WEB3_WS_URL=ws://hardhat-node:8545
      # .env points at localhost, which inside this container is the container
      # itself; the listener polls the node over the compose network instead.
      - WEB3_RPC_URL=http://hardhat-node:8545
      - REDIS_URL=redis://redis:6379
    volumes:
      # Contract ABIs are git-ignored build output that hardhat-deploy writes
      # into this checkout; the service reads them at startup.
      - ./mocks:/app/mocks:ro
    # `.env` carries the deployment addresses; the generated, git-ignored
    # `.env.mock` is listed last so the local mock chain overrides them. See
    # docs/DEV_SETUP.md.
    env_file:
      - path: .env
        required: false
      - path: .env.mock
        required: false
    depends_on:
      redis:
        condition: service_healthy
      hardhat-deploy:
        condition: service_completed_successfully

  proof-submitter:
    build:
      context: .
      dockerfile: proof_submitter/Dockerfile
    environment:
      - WEB3_RPC_URL=http://hardhat-node:8545
      - REDIS_URL=redis://redis:6379
    volumes:
      # Same compile-time ABI dependency as event-listener.
      - ./mocks:/app/mocks:ro
    # Same precedence as event-listener: `.env` first, generated mock overrides last.
    env_file:
      - path: .env
        required: false
      - path: .env.mock
        required: false
    depends_on:
      redis:
        condition: service_healthy
      hardhat-deploy:
        condition: service_completed_successfully

  verification-api:
    build:
      context: .
      dockerfile: verification/Dockerfile
    environment:
      - MODEL_STORAGE_URL=http://ipfs:5001
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      ipfs:
        condition: service_started

  fl-orchestrator:
    build:
      context: .
      dockerfile: federated_learning/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - MODEL_STORAGE_URL=http://ipfs:5001
      - FL_NUM_CLIENTS=3
      - FL_NUM_ROUNDS=3
      - FL_MODEL_ID=fl-demo-model
    depends_on:
      redis:
        condition: service_healthy
      ipfs:
        condition: service_started

volumes:
  redis_data:
  ipfs_data:
