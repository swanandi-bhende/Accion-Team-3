[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-ai-execution"
version = "0.1.0"
description = "Verifiable AI Execution subsystem (Team 3b) with TEE and zkML"
authors = [
    {name = "Team 3b"}
]
dependencies = [
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "web3>=6.11.0",
    "redis>=5.0.0",
    "flwr>=1.39.0",
    "pydantic>=2.5.0",
    "ezkl>=23.0.5",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.98.0",
    "bandit>=1.7.5",
    "black>=23.12.0",
    "mypy>=1.8.0"
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
